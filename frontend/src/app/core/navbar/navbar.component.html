<header class="navbar">
    <a routerLink="/" class="logo">
        <svg class="animated-logo" viewBox="0 0 24 24" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
			<path d="M12 22 L12 12 M12 15 Q18 15 18 9 Q12 9 12 15 M12 18 Q6 18 6 12 Q12 12 12 18" />
		</svg>
        <span class="logo-text">SmartGarden</span>
    </a>

    <div class="nav-container" [class.open]="isMenuOpen">
        <nav class="nav-links">
            @if (auth.isLoggedIn()) {
                <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">Dashboard</a>
            } @else {
                <a routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Home</a>
            }
            <a routerLink="/shop" routerLinkActive="active" (click)="closeMenu()">Shop</a>
            <a routerLink="/help" routerLinkActive="active" (click)="closeMenu()">Aiuto</a>

            @if (!auth.isLoggedIn()) {
                <a routerLink="/auth/login" class="btn btn-login mobile-login-btn" (click)="closeMenu()">Accedi</a>
            }
        </nav>
    </div>

    <div class="nav-actions">
        <a routerLink="/checkout" class="nav-cart-btn" [class.cart-empty-hidden]="cartItemCount === 0" aria-label="Vai al carrello" (click)="closeMenu()">
            <svg height="26" viewBox="0 0 30 30" width="26" xmlns="http://www.w3.org/2000/svg">
                <path d="M10.5 17h14c.278 0 .5.223.5.5s-.222.5-.5.5h-14c-.276 0-.5-.223-.5-.5s.224-.5.5-.5zm-1-4h16c.278 0 .5.223.5.5s-.222.5-.5.5h-16c-.276 0-.5-.223-.5-.5s.224-.5.5-.5zm-9-8c-.653 0-.67 1 0 1h3.6c.078.346.64 2.81 1.312 5.736.717 3.126 1.452 7.32 1.606 7.893.132.494.255 1.055.62 1.544.362.488 1 .826 1.862.826h16c.86 0 1.5-.338 1.863-.826.364-.49.487-1.05.62-1.545.265-.993 1.62-6.944 1.89-7.952.152-.566.202-1.156.022-1.69-.18-.534-.72-.988-1.395-.988h-20c-.653 0-.66 1 0 1h20c.325 0 .366.07.447.31.08.238.076.674-.04 1.108-.267.992-1.62 6.945-1.89 7.953-.135.506-.262.945-.456 1.206-.194.262-.42.424-1.06.424h-16c-.64 0-.866-.162-1.06-.424-.195-.26-.322-.7-.458-1.205-.114-.426-.88-4.732-1.595-7.856-.717-3.125-1.4-6.125-1.4-6.125C4.938 5.16 4.735 5 4.5 5zm23 18c-1.373 0-2.5 1.125-2.5 2.5s1.127 2.5 2.5 2.5c1.376 0 2.5-1.125 2.5-2.5S24.877 23 23.5 23zm0 1c.836 0 1.5.666 1.5 1.5s-.664 1.5-1.5 1.5c-.833 0-1.5-.666-1.5-1.5s.667-1.5 1.5-1.5zm-12-1C10.128 23 9 24.125 9 25.5s1.127 2.5 2.5 2.5c1.376 0 2.5-1.125 2.5-2.5S12.877 23 11.5 23zm0 1c.836 0 1.5.666 1.5 1.5s-.664 1.5-1.5 1.5c-.833 0-1.5-.666-1.5-1.5s.667-1.5 1.5-1.5z"/></svg>
            <span class="cart-badge">{{ cartItemCount }}</span>
        </a>

        @if (auth.isLoggedIn()) {
            <app-profile-dropdown></app-profile-dropdown>
        } @else {
            <a routerLink="/auth/login" class="btn btn-login desktop-login-btn" (click)="closeMenu()">Accedi</a>
        }

        <div class="menu-icon" (click)="isMenuOpen = !isMenuOpen">
            ☰
        </div>
    </div>
</header>
